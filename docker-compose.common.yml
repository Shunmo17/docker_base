services:
  normal:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

    environment:
      - LAUNCH_SSH_SERVER=${LAUNCH_SSH_SERVER:-true}

    ports:
      - ${SSH_PORT:-222}:222

    volumes:
      - /home/$USER/.ssh/authorized_keys:/tmp/authorized_keys:ro
      - /home/$USER/.ssh/id_rsa:/tmp/id_rsa:ro

  nvidia-edl-desktop:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

    environment:
      - TZ=UTC
      - DISPLAY_SIZEW=${DISPLAY_SIZEW:-1920}
      - DISPLAY_SIZEH=${DISPLAY_SIZEH:-1080}
      - DISPLAY_REFRESH=${DISPLAY_REFRESH:-60}
      - DISPLAY_DPI=${DISPLAY_DPI:-96}
      - BASIC_AUTH_PASSWORD=${PASSWD:-user}
      - DISPLAY_CDEPTH=24
      - VIDEO_PORT=DFP
      - SELKIES_ENCODER=nvh264enc
      - LAUNCH_SSH_SERVER=${LAUNCH_SSH_SERVER:-true}

    user: user
    working_dir: /home/user

    ports:
      - "${WEB_RTC_PORT:-8080}:8080"
      - "${VNC_PORT:-5900}:5900"
      - "${SSH_PORT:-222}:222"

    volumes:
      - /home/$USER/.ssh/authorized_keys:/tmp/authorized_keys:ro
      - /home/$USER/.ssh/id_rsa:/tmp/id_rsa:ro

    tmpfs: /dev/shm:rw
